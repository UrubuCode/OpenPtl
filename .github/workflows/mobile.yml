name: Mobile

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Init Android project
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bun run tauri android init

      - name: Build Android APK (release)
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bun run tauri android build --apk --target aarch64

      # Release APKs are unsigned and won't install. Sign with an ephemeral
      # keystore so the artifact is sideloadable for testing (signature identity
      # is throwaway; uninstall the previous build before installing a new one).
      - name: Sign APK
        run: |
          KS="$RUNNER_TEMP/openptl-ci.jks"
          keytool -genkeypair -v -keystore "$KS" -alias openptl \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass androidci -keypass androidci -dname "CN=OpenPtl CI"
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-unsigned.apk' | head -1)
          echo "Unsigned APK: $UNSIGNED"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-pass pass:androidci \
            --key-pass pass:androidci --out "$RUNNER_TEMP/openptl-release.apk" \
            "$RUNNER_TEMP/aligned.apk"
          ls -lh "$RUNNER_TEMP/openptl-release.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openptl-android-release
          path: ${{ runner.temp }}/openptl-release.apk
          if-no-files-found: error

  ios:
    # macos-latest currently ships Xcode 26.x, which dropped the Swift 5.6
    # compatibility libraries (swiftCompatibility56 / ...Concurrency) that the
    # Tauri-generated iOS project still auto-links, breaking the final link.
    # macos-14 ships Xcode 16.x, which still provides them.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Init iOS project
        run: bun run tauri ios init

      # CI has no Apple signing identity, so build for the simulator target,
      # which Xcode builds without code signing. Producing a signed .ipa for
      # device/TestFlight needs an Apple Developer account + secrets (follow-up).
      - name: Build iOS app (simulator, unsigned)
        run: bun run tauri ios build --target aarch64-sim

      - name: Upload iOS app
        uses: actions/upload-artifact@v4
        with:
          name: openptl-ios-sim
          path: src-tauri/gen/apple/build/**/*.app
          if-no-files-found: warn
