name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            artifact: openptl-windows-x86_64.exe
            binary: openptl.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-aarch64
            artifact: openptl-darwin-aarch64
            binary: openptl
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            artifact: openptl-linux-x86_64
            binary: openptl

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Conferir versao da tag contra o Cargo.toml
        id: ver
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::Tag v${tag_version} nao bate com a versao ${cargo_version} do Cargo.toml"
            exit 1
          fi
          echo "version=${tag_version}" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Slint desenha por conta propria; precisa das bibliotecas de janela e
      # fonte do sistema, nao de WebKit.
      - name: Instalar dependencias de Linux
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libfontconfig1-dev \
            libwayland-dev \
            libxcb1-dev \
            libssl-dev

      - name: Compilar
        run: cargo build --release --target ${{ matrix.target }}

      - name: Nomear o artefato
        id: artifact
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${{ matrix.artifact }}"
          echo "path=${{ matrix.artifact }}" >> "$GITHUB_OUTPUT"

      # A chave e a mesma de sempre: o aplicativo instalado confere a assinatura
      # com a chave publica embutida em src/constants.rs.
      - name: Assinar com minisign
        shell: bash
        env:
          MINISIGN_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cargo install minisign --locked
          printf '%s' "$MINISIGN_KEY" > minisign.key
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s minisign.key -m "${{ matrix.artifact }}"
          rm -f minisign.key

      - name: Publicar plataforma
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.minisig

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # latest.json mantem o formato que o updater ja espera: versao, notas e um
      # par url/signature por plataforma.
      - name: Montar latest.json
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

          platforms=""
          for directory in artifacts/*/; do
            platform=$(basename "$directory")
            artifact=$(find "$directory" -type f ! -name '*.minisig' -printf '%f\n' | head -1)
            signature=$(cat "${directory}${artifact}.minisig")
            entry=$(jq -n --arg url "${base}/${artifact}" --arg sig "$signature" \
              '{url: $url, signature: $sig}')
            platforms=$(jq -n --argjson acc "${platforms:-{}}" --arg key "$platform" \
              --argjson value "$entry" '$acc + {($key): $value}')
          done

          jq -n --arg version "$version" --arg notes "Release automatica de ${GITHUB_REF_NAME}." \
            --argjson platforms "$platforms" \
            '{version: $version, notes: $notes, platforms: $platforms}' > latest.json
          cat latest.json

      - name: Publicar release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "OpenPtl ${GITHUB_REF_NAME}" \
            --notes "Release automatica de ${GITHUB_REF_NAME}." \
            || true
          gh release upload "${GITHUB_REF_NAME}" latest.json --clobber
          find artifacts -type f -exec gh release upload "${GITHUB_REF_NAME}" {} --clobber \;
