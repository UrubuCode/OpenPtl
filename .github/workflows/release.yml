name: Release

# Uma tag publica o canal estavel. O disparo manual publica o canary, que e
# uma release rolante na tag `canary-latest` — o endereco fixo que o aplicativo
# consulta em `RELEASE_MANIFEST_CANARY_URL`.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Resolve versao, tag e canal uma unica vez. Antes cada job da matriz refazia
  # a conta, e a divergencia so aparecia quando um deles falhava sozinho.
  version:
    name: Resolver versao
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      channel: ${{ steps.resolve.outputs.channel }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5

      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          cargo_version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
            # O numero embutido no binario vem do Cargo.toml. Publicar uma tag
            # que nao bate com ele entregaria um aplicativo que se apresenta
            # com a versao errada e nunca se daria por desatualizado.
            if [ "$version" != "$cargo_version" ]; then
              echo "::error::Tag v${version} nao bate com a versao ${cargo_version} do Cargo.toml. Atualize o Cargo.toml e refaca a tag."
              exit 1
            fi
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            # Pre-lancamento semver: 0.1.3-canary.7 e menor que 0.1.3 e maior
            # que 0.1.2, que e exatamente como o updater deve compara-lo.
            version="${cargo_version}-canary.${GITHUB_RUN_NUMBER}"
            echo "channel=canary" >> "$GITHUB_OUTPUT"
            echo "tag=canary-latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Publicando ${version}"

  build:
    name: Compilar ${{ matrix.platform }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            artifact: openptl-windows-x86_64.exe
            binary: openptl.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-aarch64
            artifact: openptl-darwin-aarch64
            binary: openptl
          # Macs Intel: a chave darwin-x86_64 ja era procurada pelo aplicativo,
          # mas nada a publicava e a atualizacao falhava nessas maquinas.
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: darwin-x86_64
            artifact: openptl-darwin-x86_64
            binary: openptl
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            artifact: openptl-linux-x86_64
            binary: openptl

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # O canary nao tem tag propria por versao, entao o numero precisa entrar
      # no Cargo.toml antes de compilar: sem isso o binario se apresentaria com
      # a versao estavel e nunca se veria desatualizado.
      - name: Fixar a versao do canary
        if: needs.version.outputs.channel == 'canary'
        shell: bash
        run: |
          set -euo pipefail
          awk -v v="${{ needs.version.outputs.version }}" '
            /^version = / && !done { print "version = \"" v "\""; done = 1; next }
            { print }
          ' Cargo.toml > Cargo.toml.new
          mv Cargo.toml.new Cargo.toml
          grep -m1 '^version = ' Cargo.toml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Slint desenha por conta propria; precisa das bibliotecas de janela e
      # fonte do sistema, nao de WebKit.
      - name: Instalar dependencias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libfontconfig1-dev \
            libwayland-dev \
            libxcb1-dev \
            libssl-dev

      - name: Compilar
        run: cargo build --release --target ${{ matrix.target }}

      - name: Nomear o artefato
        shell: bash
        run: cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${{ matrix.artifact }}"

      # A assinatura acontece uma vez so, no job de publicacao. Assinar aqui
      # exigiria instalar o minisign em tres sistemas diferentes e exporia a
      # chave privada a quatro maquinas em vez de uma.
      - name: Publicar plataforma
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ matrix.artifact }}

  publish:
    name: Publicar release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # O `minisign` do crates.io e biblioteca, nao programa: `cargo install`
      # sempre falhou aqui com "has no binaries", e nenhuma release chegou a ser
      # assinada. O binario oficial vem do apt, com o release do autor como
      # reserva caso o pacote nao exista na imagem.
      - name: Instalar minisign
        run: |
          set -euo pipefail
          if sudo apt-get update && sudo apt-get install -y minisign; then
            minisign -v
            exit 0
          fi

          version="0.12"
          url="https://github.com/jedisct1/minisign/releases/download/${version}/minisign-${version}-linux-x86_64.tar.gz"
          curl -fsSL "$url" -o minisign.tar.gz
          tar -xzf minisign.tar.gz
          sudo install -m 0755 "minisign-linux/x86_64/minisign" /usr/local/bin/minisign
          minisign -v

      # A chave e a mesma de sempre: o aplicativo instalado confere a assinatura
      # com a chave publica embutida em src/constants.rs.
      - name: Assinar os artefatos
        env:
          MINISIGN_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_KEY}" ]; then
            echo "::error::Sem chave de assinatura. Uma release sem assinatura seria recusada pelo proprio aplicativo."
            exit 1
          fi

          printf '%s' "$MINISIGN_KEY" > minisign.key
          # O segredo pode estar guardado como o arquivo de chave ou como o
          # base64 dele, que e como o Tauri costumava exporta-lo.
          if ! grep -q 'untrusted comment' minisign.key; then
            base64 -d minisign.key > minisign.decoded && mv minisign.decoded minisign.key
          fi

          trap 'rm -f minisign.key' EXIT
          for artifact in artifacts/*/*; do
            case "$artifact" in
              *.minisig) continue ;;
            esac
            printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s minisign.key -m "$artifact"
          done

      # Conferir com a chave publica que o aplicativo carrega: uma assinatura
      # feita com a chave errada so seria descoberta na maquina do usuario, no
      # momento em que a atualizacao fosse recusada.
      - name: Conferir as assinaturas
        run: |
          set -euo pipefail
          public_key=$(grep -A1 'RELEASE_PUBLIC_KEY' src/constants.rs | grep -o 'RWS[A-Za-z0-9+/=]*')
          printf 'untrusted comment: minisign public key\n%s\n' "$public_key" > minisign.pub
          for artifact in artifacts/*/*; do
            case "$artifact" in
              *.minisig) continue ;;
            esac
            minisign -V -p minisign.pub -m "$artifact"
          done

      # latest.json mantem o formato que o updater ja espera: versao, notas e um
      # par url/signature por plataforma.
      - name: Montar latest.json
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          platforms='{}'
          for directory in artifacts/*/; do
            platform=$(basename "$directory")
            artifact=$(find "$directory" -type f ! -name '*.minisig' -printf '%f\n' | head -1)
            if [ -z "$artifact" ]; then
              echo "::error::A plataforma ${platform} nao produziu artefato"
              exit 1
            fi
            signature=$(cat "${directory}${artifact}.minisig")
            entry=$(jq -n --arg url "${base}/${artifact}" --arg sig "$signature" \
              '{url: $url, signature: $sig}')
            platforms=$(jq -n --argjson acc "$platforms" --arg key "$platform" \
              --argjson value "$entry" '$acc + {($key): $value}')
          done

          jq -n --arg version "$VERSION" \
            --arg notes "Release automatica de ${TAG}." \
            --argjson platforms "$platforms" \
            '{version: $version, notes: $notes, platforms: $platforms}' > latest.json
          cat latest.json

      # O canary e rolante: a release e a tag anteriores saem para que a nova
      # aponte para este commit. Sem apagar a tag, `gh release create` a
      # reaproveitaria apontando para o commit antigo.
      - name: Recriar a release do canary
        if: needs.version.outputs.channel == 'canary'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            --target "${GITHUB_SHA}" \
            --title "OpenPtl canary ${{ needs.version.outputs.version }}" \
            --notes "Build automatica de ${GITHUB_SHA}." \
            --prerelease

      # Sem `|| true`: uma falha aqui precisa parar a esteira, e nao seguir para
      # um upload contra uma release que nao existe.
      - name: Criar a release estavel
        if: needs.version.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} ja existe; os artefatos serao substituidos."
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "OpenPtl ${TAG}" \
              --generate-notes
          fi

      - name: Enviar artefatos e manifesto
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          find artifacts -type f -print0 | xargs -0 gh release upload "$TAG" --clobber
          # O manifesto vai por ultimo: enquanto ele nao esta la, o aplicativo
          # continua vendo a versao anterior em vez de uma release incompleta.
          gh release upload "$TAG" latest.json --clobber

      # Confere o endereco exato que `src/constants.rs` consulta. Uma release
      # que sobe sem manifesto legivel deixa o aplicativo sem atualizacao sem
      # que nada tenha falhado visivelmente.
      - name: Conferir o manifesto publicado
        env:
          TAG: ${{ needs.version.outputs.tag }}
          CHANNEL: ${{ needs.version.outputs.channel }}
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = "stable" ]; then
            url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json"
          else
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/latest.json"
          fi

          echo "Conferindo ${url}"
          curl -fsSL --retry 5 --retry-delay 5 "$url" > publicado.json
          jq -e '.platforms | keys' publicado.json
          published=$(jq -r '.version' publicado.json)
          if [ "$published" != "${{ needs.version.outputs.version }}" ]; then
            echo "::error::O manifesto publicado anuncia ${published}, nao ${{ needs.version.outputs.version }}"
            exit 1
          fi
