name: Canary

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canary
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute canary version
        id: ver
        shell: bash
        run: |
          conf_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          # Bump patch so canary sorts above the current stable but below the next release.
          next=$(node -p "const [a,b,c]=require('./src-tauri/tauri.conf.json').version.split('.').map(Number); [a,b,c+1].join('.')")
          # Pre-release identifier must be numeric-only for the Windows MSI target
          # (<=65535). Use the run number so it stays MSI-valid and semver-sortable.
          canary="${next}-${{ github.run_number }}"
          echo "conf=${conf_version} canary=${canary}"
          echo "version=${canary}" >> "$GITHUB_OUTPUT"

      - name: Patch tauri.conf.json version
        shell: bash
        env:
          CANARY_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          node -e "const fs=require('fs'); const p='./src-tauri/tauri.conf.json'; const c=JSON.parse(fs.readFileSync(p)); c.version=process.env.CANARY_VERSION; fs.writeFileSync(p, JSON.stringify(c, null, 2));"
          node -p "require('./src-tauri/tauri.conf.json').version"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: canary-${{ matrix.target }}

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: canary-latest
          releaseName: "OpenPtl canary"
          releaseBody: |
            Rolling canary pre-release built from `main`.

            Version: ${{ steps.ver.outputs.version }} (run ${{ github.run_number }})
          releaseDraft: false
          prerelease: true
          args: --target ${{ matrix.target }}

  android:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute canary version
        id: ver
        shell: bash
        run: |
          next=$(node -p "const [a,b,c]=require('./src-tauri/tauri.conf.json').version.split('.').map(Number); [a,b,c+1].join('.')")
          # Pre-release identifier must be numeric-only for the Windows MSI target
          # (<=65535). Use the run number so it stays MSI-valid and semver-sortable.
          canary="${next}-${{ github.run_number }}"
          echo "canary=${canary}"
          echo "version=${canary}" >> "$GITHUB_OUTPUT"

      - name: Patch tauri.conf.json version
        shell: bash
        env:
          CANARY_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          node -e "const fs=require('fs'); const p='./src-tauri/tauri.conf.json'; const c=JSON.parse(fs.readFileSync(p)); c.version=process.env.CANARY_VERSION; fs.writeFileSync(p, JSON.stringify(c, null, 2));"
          node -p "require('./src-tauri/tauri.conf.json').version"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: canary-android

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Init Android project
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bun run tauri android init

      - name: Allow APK install (self-updater)
        run: |
          MANIFEST=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          if ! grep -q REQUEST_INSTALL_PACKAGES "$MANIFEST"; then
            awk '/<application/ && !done {print "    <uses-permission android:name=\"android.permission.REQUEST_INSTALL_PACKAGES\" />"; done=1} {print}' "$MANIFEST" > "$MANIFEST.tmp" && mv "$MANIFEST.tmp" "$MANIFEST"
          fi
          grep INSTALL_PACKAGES "$MANIFEST" || { echo "manifest patch failed"; exit 1; }

      - name: Build Android APK (release)
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bun run tauri android build --apk --target aarch64

      # Release APKs are unsigned and won't install. Sign with an ephemeral
      # keystore so the artifact is sideloadable for testing (signature identity
      # is throwaway; uninstall the previous build before installing a new one).
      - name: Sign APK
        run: |
          KS="$RUNNER_TEMP/openptl-ci.jks"
          keytool -genkeypair -v -keystore "$KS" -alias openptl \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass androidci -keypass androidci -dname "CN=OpenPtl CI"
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-unsigned.apk' | head -1)
          echo "Unsigned APK: $UNSIGNED"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-pass pass:androidci \
            --key-pass pass:androidci --out "$RUNNER_TEMP/openptl-release.apk" \
            "$RUNNER_TEMP/aligned.apk"
          ls -lh "$RUNNER_TEMP/openptl-release.apk"

      - name: Prepare release artifacts
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cp "$RUNNER_TEMP/openptl-release.apk" openptl.apk
          node -e "require('fs').writeFileSync('android-latest.json', JSON.stringify({
            version: process.env.VERSION,
            notes: 'Canary build ${{ github.run_number }}',
            url: 'https://github.com/UrubuCode/OpenPtl/releases/download/canary-latest/openptl.apk'
          }, null, 2))"
          cat android-latest.json

      - name: Upload APK + manifest to canary release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload canary-latest openptl.apk android-latest.json --clobber
