[package]
name = "openptl"
version = "0.1.0"
description = "Gerenciador nativo de conexões SSH e SFTP"
edition = "2021"

[build-dependencies]
slint-build = "1.17"

[dependencies]
slint = "1.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
directories = "6"
rand = "0.8"
sha2 = "0.10"
futures-util = "0.3"
russh = "0.52.0"
russh-sftp = "2.1.1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "io-util", "macros", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rustls-native-certs = "0.8"
urlencoding = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
zeroize = "1"
alacritty_terminal = "0.26"
cosmic-text = { version = "0.19", features = ["syntect"] }
aes-gcm = "0.10"
open = "5"
minisign-verify = "0.2"
semver = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = "2.3"
# Dialogos nativos de arquivo: sem backend movel, como o keyring.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "common-controls-v6"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
tempfile = "3"
