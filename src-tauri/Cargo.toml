[package]
name = "openptl"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "openptl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }
anyhow = "1"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
directories = "6"
open = "5"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
rustls-native-certs = "0.8"
futures-util = "0.3"
russh = "0.52.0"
russh-sftp = "2.1.1"
tempfile = "3"
tokio = { version = "1", features = ["time", "net", "io-util", "macros"] }
tokio-rustls = "0.26.4"
urlencoding = "2"
uuid = { version = "1", features = ["v4", "serde"] }
x509-cert = { version = "0.2", default-features = false, features = ["std"] }

# Desktop-only: global input capture (rdev) and the OS keychain (keyring) have no
# Android/iOS backend. Gated out of the mobile build; mobile fallbacks live in
# libs/key_actions_stub.rs and libs/secret_store.rs.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rdev = "0.5.3"
keyring = "2.3"
# Desktop auto-update: the updater plugin has no mobile backend (Android uses a
# raw APK download + installer intent instead), so it is gated to desktop.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "macos")'.dependencies]
macos-accessibility-client = "0.0.2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# Size-optimized release: strips symbols, LTO, size opt-level. Keeps the mobile
# APK (and desktop installers) small — a debug build ships the unstripped,
# unoptimized Rust lib and balloons to hundreds of MB.
[profile.release]
strip = true
lto = true
opt-level = "s"
codegen-units = 1
